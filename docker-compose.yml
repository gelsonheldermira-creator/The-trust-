services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ./the_trust_backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/the_trust.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - trust_data:/data
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
volumes:
  trust_data:
